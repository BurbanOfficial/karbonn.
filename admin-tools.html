<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Tools — Karbonn</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    .card { background: #f5f5f7; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    button { background: #0071e3; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-right: 10px; }
    button:hover { background: #005bb5; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .result { margin-top: 10px; padding: 10px; background: #e8f5e9; border-radius: 8px; font-size: 13px; }
    .error { background: #ffebee; }
    #auth-section { margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>Admin Tools — Karbonn</h1>

  <div id="auth-section">
    <input type="email" id="email" placeholder="Email" style="padding: 10px; width: 200px; margin-right: 10px;">
    <input type="password" id="password" placeholder="Mot de passe" style="padding: 10px; width: 150px; margin-right: 10px;">
    <button onclick="login()">Connexion</button>
    <div id="user-info" style="margin-top: 10px; font-size: 13px;"></div>
  </div>

  <div class="card">
    <h3>1. Sync metadata subscriptions Stripe</h3>
    <p style="font-size: 13px; color: #666;">Met à jour les metadata (siteId, clientId, domain) de toutes les subscriptions Stripe actives.</p>
    <button onclick="syncMetadata()" id="btn-sync">Exécuter</button>
    <div id="result-sync" class="result" style="display:none;"></div>
  </div>

  <div class="card">
    <h3>2. Backfill factures Qonto</h3>
    <p style="font-size: 13px; color: #666;">Recrée les factures Qonto manquantes pour les paiements Stripe réussis.</p>
    <label style="font-size: 13px;">Depuis combien de jours ? <input type="number" id="sinceDays" value="30" style="width: 60px; padding: 5px;"></label>
    <button onclick="backfillQonto()" id="btn-backfill">Exécuter</button>
    <div id="result-backfill" class="result" style="display:none;"></div>
  </div>

  <script>
    let currentUser = null;

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await firebase.auth().signInWithEmailAndPassword(email, password);
        currentUser = firebase.auth().currentUser;
        document.getElementById('user-info').textContent = `Connecté : ${currentUser.email}`;
        document.getElementById('auth-section').style.display = 'none';
      } catch (err) {
        alert('Erreur de connexion : ' + err.message);
      }
    }

    async function getToken() {
      if (!currentUser) {
        alert('Connecte-toi d\'abord');
        throw new Error('Not authenticated');
      }
      return await currentUser.getIdToken();
    }

    async function syncMetadata() {
      const btn = document.getElementById('btn-sync');
      const result = document.getElementById('result-sync');
      btn.disabled = true;
      result.style.display = 'block';
      result.className = 'result';
      result.textContent = 'Traitement en cours...';

      try {
        const token = await getToken();
        const res = await fetch('https://karbonn-x-abby.onrender.com/api/admin/sync-subscriptions-metadata', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        result.textContent = `✅ ${data.updated} mises à jour, ${data.skipped} ignorées, ${data.errors} erreurs`;
      } catch (err) {
        result.className = 'result error';
        result.textContent = `❌ Erreur : ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    async function backfillQonto() {
      const btn = document.getElementById('btn-backfill');
      const result = document.getElementById('result-backfill');
      const sinceDays = document.getElementById('sinceDays').value;
      btn.disabled = true;
      result.style.display = 'block';
      result.className = 'result';
      result.textContent = 'Traitement en cours...';

      try {
        const token = await getToken();
        const res = await fetch('https://karbonn-x-abby.onrender.com/api/admin/backfill-qonto-invoices', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ sinceDays: parseInt(sinceDays) })
        });
        const data = await res.json();
        result.textContent = `✅ ${data.created} factures créées, ${data.skipped} ignorées, ${data.errors} erreurs`;
      } catch (err) {
        result.className = 'result error';
        result.textContent = `❌ Erreur : ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
